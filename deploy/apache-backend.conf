# ─── VirtualHost Backend Laravel (API) ────────────────────────────────────────
# Fichier : apache-backend.conf

<VirtualHost *:80>
    ServerName apisenbaboba.dstcomputing.com

    # Pointer sur le dossier public/ de Laravel
    DocumentRoot "/var/www/smartcommerce/backend/public"

    <Directory "/var/www/smartcommerce/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # CORS est configuré par Laravel dans config/cors.php.

    ErrorLog "logs/baobab-api-error.log"
    AccessLog "logs/baobab-api-access.log" combined
</VirtualHost>
